<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>倚盟公告簽收</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：手機優先的單欄閱讀流程（一次一條、條列重點），後台為較寬的名冊表與左右對照的編輯區。
   顏色有固定意思：綠＝要做、紅＝不可以、黃＝後果、藍＝說明。 */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#14251F; --muted:#586962; --line:#D3DCD7;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#DCEDE8;
  --seal:#BF3A2B; --seal-soft:#F8E3DF;
  --ok:#1C7448; --ok-soft:#DDF1E5; --info:#1F5FA8; --info-soft:#DEE9F7; --warn:#8A5A00; --warn-soft:#FAEDCB;
  --sign-paper:#FFFFFF; --sign-ink:#14251F;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#17201D; --surface-2:#1D2824; --ink:#E6EEEA; --muted:#9AABA4; --line:#2C3934;
    --accent:#4DBFAB; --accent-ink:#06211C; --accent-soft:#16332D;
    --seal:#F07363; --seal-soft:#3A1C18;
    --ok:#5BC98D; --ok-soft:#15301F; --info:#84B6F0; --info-soft:#17283E; --warn:#E6B54E; --warn-soft:#382C10;
    --sign-paper:#FFFFFF; --sign-ink:#14251F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17201D; --surface-2:#1D2824; --ink:#E6EEEA; --muted:#9AABA4; --line:#2C3934;
  --accent:#4DBFAB; --accent-ink:#06211C; --accent-soft:#16332D;
  --seal:#F07363; --seal-soft:#3A1C18;
  --ok:#5BC98D; --ok-soft:#15301F; --info:#84B6F0; --info-soft:#17283E; --warn:#E6B54E; --warn-soft:#382C10;
  --sign-paper:#FFFFFF; --sign-ink:#14251F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:13px}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.switch button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:9px 16px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.note{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:8px 12px}
button:focus-visible,select:focus-visible,canvas:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.narrow{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.35;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.btn{font:inherit;font-weight:700;font-size:16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:13px 18px;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line);font-weight:500}
.btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .grow{flex:1 1 160px}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick button{font:inherit;font-size:17px;font-weight:500;padding:14px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}

.who{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
.who b{font-size:18px}
.ann{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.todo{background:var(--seal-soft);color:var(--seal)}
.pill.doing{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.tag{background:var(--accent-soft);color:var(--accent)}
.pill.draft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.steps{display:flex;gap:4px;align-items:center}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.wide{flex:2}
.stepline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}

/* 條文卡：標籤、標題、條列重點 */
.clause{padding:22px 20px;gap:16px}
.chead{display:flex;align-items:center;gap:10px}
.clause .tag{font-family:var(--display);font-weight:900;font-size:15px;color:var(--accent-ink);background:var(--accent);padding:2px 12px;border-radius:4px;letter-spacing:.1em}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.it{display:flex;gap:12px;align-items:flex-start;font-size:19px;line-height:1.65}
.it .ic{flex:none;width:26px;height:26px;margin-top:3px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1}
.it .tx{min-width:0}
.k-ok .ic{background:var(--ok-soft);color:var(--ok)}
.k-no .ic{background:var(--seal-soft);color:var(--seal)}
.k-warn .ic{background:var(--warn-soft);color:var(--warn)}
.k-dot .ic{background:var(--info-soft);color:var(--info)}
mark{background:none;font-weight:700;padding:0 1px}
.k-ok mark{color:var(--ok);background:linear-gradient(transparent 64%,var(--ok-soft) 0)}
.k-no mark{color:var(--seal);background:linear-gradient(transparent 64%,var(--seal-soft) 0)}
.k-warn mark{color:var(--warn);background:linear-gradient(transparent 64%,var(--warn-soft) 0)}
.k-dot mark,.q mark{color:var(--info);background:linear-gradient(transparent 64%,var(--info-soft) 0)}
details.law{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--muted)}
details.law summary{cursor:pointer;padding:8px 0;font-size:15px}
details.law p{margin:8px 0 0}
.cex{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:15px;line-height:1.9;overflow-wrap:anywhere}
.cex-sep{font-size:0;line-height:0;border-top:2px dashed var(--line);margin:10px 0}
.cex-t{font-weight:700;font-size:1.05em;margin-bottom:2px}
.cex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.cex-copy{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
ol.croute{list-style:none;margin:0;padding:0;counter-reset:r;display:flex;flex-direction:column}
ol.croute li{counter-increment:r;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:7px 0;font-size:18px;line-height:1.6;position:relative}
ol.croute li::before{content:counter(r);width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;z-index:1}
ol.croute li:not(:last-child)::after{content:"";position:absolute;left:15px;top:39px;bottom:-7px;width:2px;background:var(--line)}
ol.croute li span{padding-top:2px}
.prev ol.croute li{font-size:15px}
.cex-h{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.prev .cex{font-size:13px}
.cnote{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.prev .cnote{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .it{font-size:13px;gap:0}
.legend .ic{width:18px;height:18px;font-size:11px;margin-top:0}

.opts{display:flex;flex-direction:column;gap:10px}
.opts button{font:inherit;font-size:17px;text-align:left;line-height:1.6;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opts .ab{flex:none;width:28px;height:28px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts button[aria-pressed="true"] .ab{background:var(--accent);color:var(--accent-ink)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.q{font-size:20px;font-weight:700;line-height:1.7;margin:0}

.fail{border-color:var(--seal)}
.fail h2{color:var(--seal)}

.signbox{background:var(--sign-paper);border:1px dashed var(--line);border-radius:var(--r);position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.signbox canvas{display:block;width:100%;height:170px;touch-action:none;border-radius:var(--r);cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}
@media (min-width:700px){.signbox canvas{height:220px}}
.signbox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa5a1;pointer-events:none;font-size:15px}
.declare{font-size:17px;line-height:1.9;margin:0}

.receipt{position:relative;overflow:hidden}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.receipt dt{color:var(--muted);font-size:14px}
.receipt dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:16px;top:16px;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.2em;color:var(--seal);border:3px solid var(--seal);border-radius:6px;padding:4px 6px 4px 10px;transform:rotate(-8deg);animation:stamp .35s ease-out}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.sigimg{background:var(--sign-paper);border-radius:6px;border:1px solid var(--line);max-width:100%;height:auto}

/* 後台 */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-size:16px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 2px;cursor:pointer;white-space:nowrap}
.tabs button.dirty::after{content:"未儲存";margin-left:6px;font-size:12px;font-weight:700;color:var(--seal);background:var(--seal-soft);border-radius:999px;padding:1px 8px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.sum{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.sum .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.sum .big small{font-size:18px;color:var(--muted);font-family:var(--body);font-weight:500}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.06em;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.store td{background:var(--surface-2);font-weight:700;font-size:14px}
td .sigimg{height:34px;width:auto;display:block}
.copyout{width:100%;min-height:120px}
input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{line-height:1.75;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 130px;min-width:0}
label.f.wide{flex-basis:100%}

/* 編輯公告：左邊打字、右邊預覽；平板直放和手機改成上下排 */
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.edgrid{grid-template-columns:minmax(0,1fr)}}
.ins{gap:6px}
.ins button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.prev{display:flex;flex-direction:column;gap:12px;min-width:0}
.prev .clause{padding:16px}
.prev .clause h1{font-size:20px}
.prev .it{font-size:16px;gap:10px}
.prev .it .ic{width:22px;height:22px;font-size:13px;margin-top:2px}
.prev .items{gap:8px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px}
.checks .e{color:var(--seal);font-weight:700}
.checks .w{color:var(--warn)}
.checks .g{color:var(--ok)}
.pq{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.pq:first-of-type{border-top:0;padding-top:0}
.pq b{font-size:16px}
.pq .a{color:var(--ok);font-weight:700}
.pq .x{color:var(--muted)}
.howto{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.8}
.howto code{font-family:inherit;color:var(--ink);font-weight:700}

/* 起草公告：訪談指令、AI 訪談流程圖、起草紀錄 */
.w-boss{--c:var(--warn);--cs:var(--warn-soft)}
.w-ai{--c:var(--info);--cs:var(--info-soft)}
.dwrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "chart" "rec";gap:16px;max-width:720px}
@media (min-width:960px){.dwrap{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"hero chart" "rec chart";grid-template-rows:auto 1fr;align-items:start}}
.dhero{grid-area:hero}
.dchart{grid-area:chart;display:flex;flex-direction:column;gap:12px;min-width:0}
.drec{grid-area:rec}
.dhero ol.croute li{font-size:16px}
.fql{list-style:none;margin:8px 0 0;padding:0;counter-reset:q;display:flex;flex-direction:column;gap:6px}
.fql li{counter-increment:q;display:grid;grid-template-columns:26px minmax(0,1fr);gap:0 8px;background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;line-height:1.55}
.fql li::before{content:counter(q);grid-row:1 / span 2;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:2px}
.fql b{font-size:15px}
.fql span{grid-column:2;color:var(--muted)}
.dex{font-size:14px}
.dex summary{cursor:pointer;padding:6px 0}
.dex summary b{color:var(--accent)}
.dsa{white-space:pre-wrap;font-size:14px;margin:8px 0 0;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.drow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:12px}
.drow details{flex:1;min-width:0}
.drow .btn{flex:none;white-space:nowrap}
/* 發布流程：流程圖。顏色＝這一步由誰做；紅色箭頭＝還不能往下走 */
.w-gm{--c:var(--warn);--cs:var(--warn-soft)}
.w-hq{--c:var(--accent);--cs:var(--accent-soft)}
.w-sv,.w-all{--c:var(--info);--cs:var(--info-soft)}
.w-back{--c:var(--seal);--cs:var(--seal-soft)}
.flowwrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "legend" "flow" "fork";gap:16px}
.fhead{grid-area:head;display:flex;flex-direction:column;gap:4px}
.fhead p{margin:0}
@media (min-width:960px){.flowwrap{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"head head" "flow legend" "flow fork";grid-template-rows:auto auto 1fr;align-items:start}}
.flegend{grid-area:legend}
.flow{grid-area:flow;display:flex;flex-direction:column;min-width:0}
.ffork{grid-area:fork}
.flegend ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.flegend li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.fsw{justify-self:center;width:26px;height:26px;border-radius:6px;background:var(--cs);border-left:6px solid var(--c)}
.flegend .fa{min-height:0;padding:0;justify-self:center}
.flegend .fa i{min-height:10px}
.flegend .fdia{justify-self:center;margin:0}
.felb{justify-self:center;color:var(--seal);display:flex}
.fphase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column}
.fphase>h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fphase>h3 small{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.fnode{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r);background:var(--cs);border-left:6px solid var(--c)}
.fnum{width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:32px}
.fh b{font-size:17px;line-height:1.4}
.fwho{font-size:13px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--surface);color:var(--c);border:1px solid var(--c);white-space:nowrap}
.fbody{min-width:0}
.fbody p{margin:4px 0 0;font-size:15px}
.fq{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;background:var(--surface);border:2px dashed var(--c);border-radius:8px;font-weight:700;font-size:15px;line-height:1.6}
.fdia{flex:none;width:12px;height:12px;background:var(--c);transform:rotate(45deg);margin:6px 3px 0}
.fd{margin-top:6px;font-size:14px}
.fd summary{cursor:pointer;color:var(--c);font-weight:700;width:fit-content;padding:6px 0}
.fd p{font-size:14px}
.fcon,.fbr{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding-left:18px;align-items:stretch}
.flow>.fcon,.flow>.fbr{padding-left:33px;padding-right:15px}
.fa{display:flex;flex-direction:column;align-items:center;color:var(--c);min-height:48px;padding:3px 0}
.fa i{flex:1;width:8px;background:currentColor;min-height:16px}

.fbrc{display:flex;flex-direction:column;gap:8px;padding:0 0 8px;min-width:0}

.fno{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;align-items:start;color:var(--seal)}

.fside{margin-top:6px;border:2px solid var(--seal);background:var(--seal-soft);border-radius:8px;padding:7px 10px;font-size:14px;line-height:1.6;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.fside b{color:var(--seal)}
.fside em{font-style:normal;font-weight:700;color:var(--seal)}
.fend{align-self:flex-start;margin:0 0 0 18px;font-size:14px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 14px;background:var(--surface-2)}
.fk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.fkc{display:flex;flex-direction:column;min-width:0}
.fkc .fa{align-self:center;min-height:40px}
.fcond{align-self:center;text-align:center;font-size:14px;font-weight:700;border:2px dashed var(--muted);border-radius:8px;padding:6px 10px}
.fmini{border-left:6px solid var(--c);background:var(--cs);border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.fmini small{font-weight:700;font-size:13px;color:var(--c)}
.fkc .fend{align-self:center;margin:0}
.chain{display:flex;flex-direction:column;gap:6px;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
.chain div{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.chain .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px}
.chain .ok .ic{background:var(--ok-soft);color:var(--ok)}
.chain .wait .ic{background:var(--warn-soft);color:var(--warn)}
.chain .me .ic{background:var(--accent);color:var(--accent-ink)}

.ctab td{vertical-align:middle}
.ctab select{max-width:220px}
.syncbar{position:sticky;top:8px;z-index:5;color:var(--ink);background:var(--surface-2);border:1px solid var(--line)}
.syncbar.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.syncbar.bad{color:var(--seal);background:var(--seal-soft);border-color:transparent;font-weight:700}
.gmsign{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.gmsign .sigimg{max-width:320px;align-self:flex-start}
.gmsign label.f{flex:none}
.gmsign input{max-width:260px}
.poster img{display:block;width:100%;max-width:520px;height:auto;border:1px solid var(--line);border-radius:6px;margin:0 auto}
/* 儲存列：編輯公告時固定在畫面最下面 */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 18px rgba(0,0,0,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sb-in{max-width:1048px;margin:0 auto;display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sb-st{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px;font-size:14px;line-height:1.5}

/* 後台：分段標題、預覽框、未簽名單、人員名單 */
.tabs .tabgap{margin-left:auto}

.edsub{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:12px}

.edcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.pvbox{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg)}

details.fold>summary{cursor:pointer;font-weight:700;padding:6px 0}

h2+.ugroup{border-top:0;padding-top:0}
.uhead{display:flex;gap:10px;align-items:baseline}
.uchips{display:flex;flex-wrap:wrap;gap:8px}

.nx{font-weight:700}
.nx.e{color:var(--seal)}
.nx.w{color:var(--warn)}
.nx.g{color:var(--ok)}
.dcol{display:flex;flex-direction:column;gap:16px;max-width:860px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:14px}
.stepb{display:flex;flex-direction:column;gap:10px;min-width:0}
.stepb p{margin:0}
.pgroup{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.phead{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.plead{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

td.nw,span.nw{white-space:nowrap}

/* 平板（簽名用的主要裝置）：同仁閱讀、答題、簽名的字和按鈕放大，欄位加寬 */
@media (min-width:700px){
  .narrow{max-width:700px}
  .narrow h1{font-size:30px}
  .newann .na-h{font-size:20px}
  .newann .na-t{font-size:22px}
  .narrow h2{font-size:21px}
  .narrow .small,.narrow .stepline,.narrow .meta,.narrow .legend{font-size:15px}
  .narrow .pill{font-size:14px}
  .narrow .btn{font-size:18px;min-height:58px}
  .narrow .btn.sm{font-size:16px;min-height:46px}
  .narrow .pick{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .narrow .pick button{font-size:20px;padding:18px 8px}
  .narrow .clause{padding:28px 28px;gap:20px}
  .narrow .clause .tag{font-size:17px}
  .narrow .items{gap:18px}
  .narrow .items .it{font-size:22px;gap:14px}
  .narrow .items .it .ic{width:30px;height:30px;font-size:17px;margin-top:4px}
  .narrow ol.croute li{font-size:20px}
  .narrow .cex{font-size:17px;padding:16px 18px}
  .narrow .cnote{font-size:16px}
  .narrow details.law,.narrow details.law summary{font-size:16px}
  .narrow .legend .ic{width:22px;height:22px;font-size:13px}
  .narrow .q{font-size:23px}
  .narrow .opts{gap:12px}
  .narrow .opts button{font-size:20px;padding:16px 18px;gap:14px}
  .narrow .opts .ab{width:34px;height:34px;font-size:17px}
  .narrow .declare{font-size:20px}
  .narrow .signbox canvas{height:280px}
  .narrow .signbox .hint{font-size:18px}
  .narrow .chain{font-size:17px}
  .narrow .receipt dt{font-size:16px}
  .narrow .receipt dd{font-size:18px}
  .narrow input[type=text],.narrow input[type=password]{font-size:20px;padding:12px 14px}
}
/* 平板直放：後台表格的格子收窄一點，不用左右滑 */
@media (max-width:900px){th,td{padding:10px 8px}}
/* 手機：分頁改成兩排按鈕，表格改成一人一格往下排，不用左右滑 */
@media (max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-bottom:0;overflow:visible}
  .tabs button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 2px;font-size:15px}
  .tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .tabs button.dirty::after{content:"●";background:none;padding:0;margin-left:3px}
  .panel{padding:16px}
  table.rtab,table.ltab,table.ctab{min-width:0;display:block}
  .rtab thead,.ltab thead,.ctab thead{display:none}
  .rtab tbody,.ltab tbody,.ctab tbody{display:block}
  .rtab tr,.ltab tr,.ctab tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .rtab td,.ltab td,.ctab td{border:0;padding:0}
  .rtab tr.store{padding:0;border:0}
  .rtab tr.store td{flex:1 1 100%;padding:8px 10px;border-radius:6px}
  .rtab td:nth-child(1){flex:1 1 100%;font-weight:700;font-size:16px}
  .rtab td:nth-child(2),.rtab td:nth-child(3){color:var(--muted);font-size:14px}
  .rtab td:nth-child(2)::before{content:"簽收時間　"}
  .rtab td:nth-child(3)::before{content:"作答　"}
  .rtab td:nth-child(4){margin-left:auto}
  .ltab td:nth-child(1){flex:1 1 100%}
  .ltab td:nth-child(3){flex:1 1 100%}
  .ltab td:nth-child(3)::before{content:"下一步　";color:var(--muted);font-size:14px}
  .ltab td:nth-child(4)::before{content:"截止日　";color:var(--muted);font-size:14px}
  .ltab td:nth-child(5){flex:1 1 100%}
  .ltab td:nth-child(5) .row{flex-wrap:wrap!important;justify-content:flex-start!important}
  .tabs .tabgap{margin-left:0}
  .ctab td:nth-child(2){font-weight:700}
  .ctab td:nth-child(3){flex:1 1 100%}
  .ctab select{max-width:none}
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>倚盟公告簽收</b><span>逐條閱讀・問答・簽名</span></div>
    <div class="switch" role="group" aria-label="切換畫面">
      <button id="nav-staff" data-act="nav" data-to="home" aria-pressed="true">同仁入口</button>
      <button id="nav-admin" data-act="nav" data-to="admin" aria-pressed="false">管理後台</button>
    </div>
  </header>
  <div class="note" id="demo-note">這是操作樣板。公告內容和簽收紀錄目前只存在這台裝置的瀏覽器，還不會同步給其他人。</div>
  <div class="note syncbar" id="syncbar" hidden></div>
  <main id="view"></main>
</div>

<script>
(function(){
"use strict";

var STORES = [];

/* 預設公告：內容就是「編輯公告」裡打字的格式 */
var SEED_TITLE = "";
var SEED_SRC = "";

var SEED_QSRC = "";

var SEED2_TITLE = "";
var SEED2_SRC = "";
var SEED2_QSRC = "";
var SEED2_REC = "";
function seed2(){ return {id:"2026-10-10-open", date:"2026-10-10", level:"重大公告", by:"營運管理部", no:"115-002", title:SEED2_TITLE, src:SEED2_SRC, qsrc:SEED2_QSRC, version:1, status:"published", updatedAt:0}; }
function seedAnns(){ return []; }

/* 正式上線時，把 Apps Script 的網址填在這裡。空白＝樣板模式，資料只存在這台裝置 */
var API = "https://script.google.com/macros/s/AKfycbxLgpyHU21twksogFIhsp7vTU1lIAk5uu4HfR99TWoPUaeyxM5agNR9jnXMHdkIQBHSqQ/exec";
var LIVE = !!API;
var DEFAULT_STORES = STORES;
var KEY = "ym-ack-v2", LKEY = "ym-ack-live";
var L = {code:"", me:null, outbox:[]};
var mem = {records:{}, me:null, anns:seedAnns(), seedRev:20};
function load(){
  try{
    if(LIVE){ var t = localStorage.getItem(LKEY); if(t){ var x = JSON.parse(t); if(x){ L.code=x.code||""; L.me=x.me||null; L.outbox=x.outbox||[]; } } return; }
    var s = localStorage.getItem(KEY); if(s){ var d = JSON.parse(s); if(d && d.records && d.anns && d.anns.length) mem = d; }
  }catch(e){}
}
function save(){ try{ if(LIVE){ L.me=mem.me; localStorage.setItem(LKEY, JSON.stringify(L)); } else localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
load();
if(LIVE){ STORES=[]; mem={records:{}, me:L.me, anns:[], drafts:[], gm:null, seedRev:999, rec2:1}; }
else { if(mem.stores && mem.stores.length) STORES=mem.stores; if(mem.leadMap) STORES.forEach(function(x){ x.lead=mem.leadMap[x.id]||""; }); }
var SEED_REV=20;
(function(){ if((mem.seedRev||1)<SEED_REV){ mem.anns.forEach(function(a){ if(a.id==="2026-10-09-cancel"){ a.src=SEED_SRC; a.qsrc=SEED_QSRC; a.title=SEED_TITLE; } }); if(!mem.anns.some(function(a){ return a.id==="2026-10-10-open"; })) mem.anns.push(seed2()); mem.seedRev=SEED_REV; save(); } })();
(function(){ if(!mem.drafts) mem.drafts=[]; if(!mem.rec2){ mem.drafts.unshift({id:"d-open-1010", at:Date.now(), title:"門市準時開門與全店出勤", text:SEED2_REC}); mem.rec2=1; save(); } })();
function rocYear(d){ var y=Number(String(d||"").slice(0,4)); return (y||new Date().getFullYear())-1911; }
function nextNo(){ return rocYear(today())+"-"+("00"+(mem.anns.length+1)).slice(-3); }
(function(){ var n=0; mem.anns.slice().reverse().forEach(function(a){ n++; if(a.by==="總經理"||a.by==="管理部") a.by="營運管理部"; if(!a.no) a.no=rocYear(a.date)+"-"+("00"+n).slice(-3); }); })();

/* ---------- 把打字內容轉成條文與題目 ---------- */
var RX = {
  ok:/^(?:[✓✔○]|[OoＯ]\s)\s*/, no:/^(?:[✕✖✗×]|[XxＸ]\s)\s*/, warn:/^(?:⚠️?|[!！])\s*/, dot:/^[•・·\-－]\s*/
};
function parseClauses(src){
  var out=[], cur=null;
  String(src||"").split(/\r?\n/).forEach(function(line){
    var s=line.trim(), m; if(!s) return;
    if((m=s.match(/^條[：:]\s*(.*)$/))){
      var parts=m[1].split(/[｜|]/);
      cur={tag: parts.length>1?parts[0].trim():"", title:(parts.length>1?parts.slice(1).join("｜"):parts[0]).trim()||"（還沒寫標題）", items:[], law:"", note:"", ex:[], route:[]};
      out.push(cur); return;
    }
    if(!cur){ cur={tag:"", title:"（還沒寫標題）", items:[], law:"", note:"", ex:[], route:[]}; out.push(cur); }
    if((m=s.match(/^原文[：:]\s*(.*)$/))){ cur.law=m[1]; return; }
    if((m=s.match(/^途徑[：:]\s*(.*)$/))){ cur.route=m[1].split(/\s*(?:→|->|＞)\s*/).filter(function(x){return x;}); return; }
    if((m=s.match(/^例[：:]\s*(.*)$/))){ if(m[1]) cur.ex.push(m[1]); return; }
    if((m=s.match(/^(?:註|備註)[：:]\s*(.*)$/))){ cur.note=(cur.note?cur.note+" ":"")+m[1]; return; }
    var k="dot";
    if(RX.ok.test(s)){ k="ok"; s=s.replace(RX.ok,""); }
    else if(RX.no.test(s)){ k="no"; s=s.replace(RX.no,""); }
    else if(RX.warn.test(s)){ k="warn"; s=s.replace(RX.warn,""); }
    else if(RX.dot.test(s)){ s=s.replace(RX.dot,""); }
    if(s) cur.items.push({k:k, t:s});
  });
  return out;
}
function parseQuiz(src){
  var out=[], cur=null;
  String(src||"").split(/\r?\n/).forEach(function(line){
    var s=line.trim(), m; if(!s) return;
    if((m=s.match(/^題[：:]\s*(.*)$/))){ cur={q:m[1], ok:[], wrong:[], c:null}; out.push(cur); return; }
    if(!cur) return;
    if((m=s.match(/^對[：:]\s*(.*)$/))){ if(m[1]) cur.ok.push(m[1]); }
    else if((m=s.match(/^錯[：:]\s*(.*)$/))){ if(m[1]) cur.wrong.push(m[1]); }
    else if((m=s.match(/^條[：:]\s*第?\s*(\d+)/))){ cur.c=Number(m[1])-1; }
  });
  return out;
}
function check(clauses, quiz){
  var e=[], w=[];
  if(!clauses.length) e.push("還沒有條文。用「條：」開頭寫第一條。");
  clauses.forEach(function(c,i){
    if(!c.items.length) e.push("第 "+(i+1)+" 條沒有重點。");
    if(c.items.length>4) w.push("第 "+(i+1)+" 條有 "+c.items.length+" 個重點，建議拆成兩條。");
    if(c.items.length && !c.items.some(function(it){return /【.+?】/.test(it.t);})) w.push("第 "+(i+1)+" 條沒有用【】標出重點字。");
  });
  if(!quiz.length) e.push("還沒有題目。用「題：」開頭寫第一題。");
  quiz.forEach(function(q,i){
    var n="第 "+(i+1)+" 題";
    if(!q.q) e.push(n+"沒有題目文字。");
    if(q.ok.length!==1) e.push(n+"要有剛好 1 個「對：」，現在有 "+q.ok.length+" 個。");
    if(q.wrong.length<2) e.push(n+"至少要有 2 個「錯：」。");
    if(q.c===null) e.push(n+"沒寫「條：」，答錯時無法告訴同仁答案在哪一條。");
    else if(q.c<0||q.c>=clauses.length) e.push(n+"寫的「條："+(q.c+1)+"」不存在。");
  });
  if(quiz.length && quiz.length!==10) w.push("題目現在有 "+quiz.length+" 題，公司的標準是 10 題。");
  clauses.forEach(function(c,i){ if(quiz.length && !(c.route&&c.route.length) && !quiz.some(function(q){return q.c===i;})) w.push("第 "+(i+1)+" 條沒有對應的題目。"); });

/* ---------- 簽署方式：主管優先（區督導 → 各門市的率先簽收人 → 同仁）或全體皆可。每則公告自己選 ----------

}

function gateFor(a, me){

  var isTop = me.store===st.topStore && me.name===st.top.name, l=st.leads[me.store]||{name:"",at:0}, isLead = !!l.name && l.name===me.name;
  var blocked = isTop ? 0 : (st.top.name && !st.top.at) ? 1 : (isLead || !l.name || l.at) ? 0 : 2;

function countDone(a){ var n=0; STORES.forEach(function(s){ s.staff.forEach(function(nm){ if(isDone(a,rec(a.id,pid(s.id,nm)))) n++; }); }); return n; }
/* 截止日：還剩幾天 */
function dueInfo(raw){
  var p=String((raw&&raw.due)||"").split("-"); if(p.length!==3) return null;
  var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])), n=new Date(), t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(isNaN(d.getTime())) return null;
  var k=Math.round((d.getTime()-t.getTime())/86400000);
  return {n:k, md:Number(p[1])+"/"+Number(p[2])+"（"+"日一二三四五六".charAt(d.getDay())+"）", text:k>0?"還剩 "+k+" 天":k===0?"今天截止":"已逾期 "+(-k)+" 天", late:k<0};
}
var TABS=[["log","公告總覽"],["draft","① 起草公告"],["edit","② 編輯公告"],["status","③ 簽收狀況"],["leads","人員名單"],["sop","流程說明"]];
function FREE_NOTE(){ var f=STORES.filter(function(s){ return isFree(s.id); }); return f.length ? '<div class="small muted">'+esc(f.map(function(s){ return s.name; }).join("、"))+'不受順序限制，公告一發布就可以簽。</div>' : ''; }

/* ---------- 人員名單：新增、離職、改名、調單位、誰是率先簽收人 ---------- */
function vLeads(){
  var pp=S.pp||{};
  var h='<div class="panel" style="max-width:860px"><h2>人員名單</h2><div class="small muted">誰要簽收、誰是率先簽收人，都在這裡改，改完馬上生效。離職的人不會被刪掉，之前的簽收紀錄都還在。</div>';
  if(S.ppErr) h+='<div class="small" id="pp-err" style="color:var(--seal);font-weight:700">'+esc(S.ppErr)+'</div>';
  h+='<div class="padd"><label class="f" for="pp-unit">單位<select id="pp-unit">'+STORES.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'; }).join("")+'</select></label><label class="f" for="pp-name">姓名（跟身分證上的字一樣）<input type="text" id="pp-name" maxlength="20" autocomplete="off"></label><button id="pp-add" class="btn sm" data-act="ppAdd">新增人員</button></div>';
  var order=STORES.filter(function(s){ return s.id===TOP_STORE; }).concat(STORES.filter(function(s){ return s.id!==TOP_STORE; }));
  order.forEach(function(s){
    var free=isFree(s.id), top=s.id===TOP_STORE;
    h+='<div class="pgroup"><div class="phead"><div><b style="font-size:17px">'+esc(s.name)+'</b>　<span class="small muted">'+s.staff.length+' 人</span></div>';
    if(free) h+='<span class="small muted">不受順序限制，公告一發布就可以簽</span>';
    else {
      var opts='<option value="">不指定</option>'; s.staff.forEach(function(nm){ opts+='<option'+(nm===(s.lead||"")?" selected":"")+'>'+esc(nm)+'</option>'; });
      h+='<label class="plead" for="lead-'+s.id+'">'+(top?"主管優先時，第一個簽的人":"率先簽收人")+'<select id="lead-'+s.id+'" data-chg="lead" data-sid="'+s.id+'">'+opts+'</select></label>';
    }
    h+='</div>';
    s.staff.forEach(function(nm,i){
      var on=pp.store===s.id && pp.name===nm, key=' data-sid="'+esc(s.id)+'" data-name="'+esc(nm)+'"', cancel='<button class="btn quiet sm" data-act="ppCancel">取消</button>';
      h+='<div class="prow"><span class="pn">'+esc(nm)+(nm===(s.lead||"")&&!free?' <span class="pill tag">率先簽收</span>':'')+'</span>';
      if(on && pp.op==="rename") h+='<input type="text" id="pp-val" maxlength="20" value="'+esc(nm)+'" aria-label="新的姓名"><button id="pp-ok" class="btn sm" data-act="ppOk">確定改名</button>'+cancel;
      else if(on && pp.op==="move") h+='<select id="pp-val" aria-label="調到哪個單位">'+STORES.filter(function(x){ return x.id!==s.id; }).map(function(x){ return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>'; }).join("")+'</select><button id="pp-ok" class="btn sm" data-act="ppOk">確定調過去</button>'+cancel;
      else if(on && pp.op==="off") h+='<span class="small" style="color:var(--seal);font-weight:700">確定 '+esc(nm)+' 離職？</span><button id="pp-ok" class="btn sm" data-act="ppOk">確定</button>'+cancel;
      else h+='<button id="pp-rename-'+s.id+'-'+i+'" class="btn quiet sm" data-act="pp" data-op="rename"'+key+'>改名</button><button id="pp-move-'+s.id+'-'+i+'" class="btn quiet sm" data-act="pp" data-op="move"'+key+'>調單位</button><button id="pp-off-'+s.id+'-'+i+'" class="btn quiet sm" data-act="pp" data-op="off"'+key+'>離職</button>';

  }
  h+='<div class="small muted">改名只能用在還沒簽過任何公告的人；已經簽過的人，紀錄是用原本的名字記的。調單位之後，之前簽過的公告不用重簽。要新增一家門市，請通知負責系統的人。</div></div>';
  return h;
}
function rosterLocal(op, sid, nm, to){   /* 樣板模式：直接改這台裝置上的名單 */
  var s=storeOf(sid), bad=function(x){ return !x || x.length>20 || /[:|,]/.test(x); };
  if(!s || bad(nm)) return "name";
  if(!mem.former) mem.former=[];
  var fi=-1; mem.former.forEach(function(f,i){ if(f.store===sid && f.name===nm) fi=i; });
  if(op==="add"){ if(s.staff.indexOf(nm)>=0) return "dup"; if(fi>=0) mem.former.splice(fi,1); s.staff.push(nm); return ""; }
  if(op==="on"){ if(fi<0) return "who"; mem.former.splice(fi,1); if(s.staff.indexOf(nm)<0) s.staff.push(nm); return ""; }
  var i=s.staff.indexOf(nm); if(i<0) return "who";
  if(op==="off"){ s.staff.splice(i,1); if(s.lead===nm) s.lead=""; mem.former.push({store:sid, storeName:s.name, name:nm}); return ""; }
  if(op==="rename"){
    if(bad(to)) return "name"; if(s.staff.indexOf(to)>=0) return "dup";
    var used=false; Object.keys(mem.records||{}).forEach(function(k){ if(mem.records[k][pid(sid,nm)]) used=true; }); if(used) return "haslog";
    s.staff[i]=to; if(s.lead===nm) s.lead=to; return "";
  }
  if(op==="move"){
    var d=storeOf(to); if(!d) return "unit"; if(d.staff.indexOf(nm)>=0) return "dup";
    s.staff.splice(i,1); if(s.lead===nm) s.lead=""; d.staff.push(nm);
    Object.keys(mem.records||{}).forEach(function(k){ var r=mem.records[k], o=r[pid(sid,nm)]; if(o){ r[pid(to,nm)]=o; delete r[pid(sid,nm)]; } });
    return "";
  }
  return "op";
}
function rosterDo(op, sid, nm, to){
  if(!nm){ S.ppErr="請先輸入姓名。"; render(); return; }
  var s0=storeOf(sid), wasLead=!!(s0 && s0.lead===nm), warn="";
  if(op==="off"||op==="move"){
    var hit=[]; published().forEach(function(r){ if(!hasOrder(r)) return; var c=r.chain; if(((sid===(c.topStore||TOP_STORE) && c.top===nm) || (c.leads||{})[sid]===nm) && !doneAt(compile(r),sid,nm)) hit.push(r.no||r.title); });
    if(wasLead) warn+=nm+" 原本是率先簽收人，請在這一頁重新指定。";
    if(hit.length) warn+="他也是公告 "+hit.join("、")+" 指定的率先簽收人，請到「③ 簽收狀況」的「簽收順序」改指定別人。";
  }
  var okMsg=({add:"已新增 "+nm+"。", off:nm+" 已設成離職。", on:nm+" 已復職。", rename:"已改名為 "+to+"。", move:"已把 "+nm+" 調過去。"})[op]+warn;
  var fin=function(){ S.pp=null; S.ppErr=""; S.msg=okMsg; render(); };
  if(!LIVE){ var e=rosterLocal(op,sid,nm,to); if(e){ S.ppErr=ERR[e]||"沒有成功，請再試一次。"; render(); return; } mem.stores=STORES; save(); fin(); return; }
  var bar=function(on){ var el=document.getElementById("syncbar"); if(!el) return; if(on){ el.hidden=false; el.className="note syncbar"; el.textContent="儲存中…"; } else el.hidden=true; };
  bar(true);
  api("rosterOp",{op:op, store:sid, name:nm, to:to}).then(function(){ return api("admin"); }).then(function(j){ applyAdmin(j); bar(false); fin(); },
    function(e2){ bar(false); S.ppErr=errText(e2); render(); });
}

function vAdmin(){
  var h='<div><h1 style="margin-bottom:12px">管理後台</h1><div class="tabs" role="tablist">';
  TABS.forEach(function(t){ h+='<button id="tab-'+t[0]+'" role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(S.adminTab===t[0])+'" class="'+(t[0]==="edit"&&S.ed&&S.ed.dirty?'dirty':'')+(t[0]==="leads"?' tabgap':'')+'">'+t[1]+'</button>'; });
  h+='</div></div>';

/* ---------- ③ 簽收狀況：先看誰還沒簽 ---------- */
function personState(a, cst, s, nm){
  var r=rec(a.id,pid(s.id,nm)), d=isDone(a,r), g=cst?gateFor(a,{store:s.id,name:nm}):null;
  var isL=!!cst && ((s.id===cst.topStore && nm===cst.top.name) || ((cst.leads[s.id]||{}).name===nm));
  return {r:r, done:d, old:!!(r&&r.status==="done"&&!d), lead:isL, blocked:g?g.blocked:0};
}
function unreadText(a){
  var raw=rawAnn(a.id), di=dueInfo(raw), lines=["【尚未簽收】"+a.title+"（"+fmtDate(a.date)+" 發布）"];
  STORES.forEach(function(s){
    var names=s.staff.filter(function(nm){ return !isDone(a,rec(a.id,pid(s.id,nm))); });
    if(names.length) lines.push(s.name+"："+names.join("、"));
  });
  lines.push(!di ? "請今天內完成閱讀與簽收。" : di.late ? "已經超過截止日 "+di.md+"，請今天內完成。" : di.n===0 ? "今天 "+di.md+"截止，請今天內完成閱讀與簽收。" : "請在 "+di.md+"前完成閱讀與簽收。");
  return lines.join("\n");
}
function vStatus(){
  var list=published(), total=totalStaff(), h="";
  if(!list.length) return '<div class="panel muted">還沒有已發布的公告。到「② 編輯公告」寫好，請總經理簽核後按「發布」，這裡才會有名單。</div>';
  if(!S.adminAnn || !list.some(function(a){return a.id===S.adminAnn;})) S.adminAnn=list[0].id;
  var a=ann(S.adminAnn), raw=rawAnn(a.id), done=countDone(a), cst=chainState(a), di=dueInfo(raw);
  h+=posterHtml(a);

  if(list.length>1){ h+='<label class="f wide">選擇公告<select id="sel-ann" data-chg="adminAnn">'; list.forEach(function(x){ h+='<option value="'+x.id+'"'+(x.id===a.id?" selected":"")+'>'+fmtDate(x.date)+'　'+esc(x.title)+'</option>'; }); h+='</select></label>'; }
  h+='<div class="ann"><div class="meta"><span class="pill tag">'+esc(a.level)+'</span><span>'+fmtDate(a.date)+' 發布</span><span>公告 '+esc(a.no||"")+' 號</span><span>簽署方式：'+MODE_NAME[modeOf(raw)]+'</span><span>第 '+a.version+' 版</span></div><h2>'+esc(a.title)+'</h2></div>';
  h+='<div class="sum"><div><div class="small muted">已簽收</div><div class="big">'+done+' <small>/ '+total+' 人</small></div></div><div><div class="small muted">尚未簽收</div><div class="big">'+(total-done)+' <small>人</small></div></div>';
  h+='<div><div class="small muted">截止日</div><div id="due-box" class="due'+(di&&di.late&&done<total?" late":"")+'">'+(di ? di.md+' <small>'+(done>=total?"全員簽完":di.text)+'</small>' : '<small>沒有設定（到「② 編輯公告」填）</small>')+'</div></div></div>';

  h+='<div class="row"><button id="btn-copy" class="btn sm" data-act="copyUnread">複製未簽收名單（貼到 LINE 提醒）</button><button id="btn-poster" class="btn ghost sm" data-act="poster" data-id="'+a.id+'">生成公告全圖</button>'+(LIVE?'<button id="btn-reload" class="btn quiet sm" data-act="reloadAdmin">重新整理</button>':'<button id="btn-demo" class="btn ghost sm" data-act="demo">填入示範資料</button><button id="btn-reset" class="btn quiet sm" data-act="reset">清除全部簽收紀錄</button>')+'</div>';
  if(S.copyText!==null) h+='<div><div class="small muted">'+esc(S.copyMsg)+'</div><textarea id="copyout" class="copyout" readonly>'+esc(S.copyText)+'</textarea></div>';
  h+='</div>';
  /* 還沒簽的人排最上面 */
  var un=0, uh="";
  STORES.forEach(function(s){
    var rows=[]; s.staff.forEach(function(nm){ var st=personState(a,cst,s,nm); if(!st.done) rows.push([nm,st]); });
    if(!rows.length) return; un+=rows.length;
    uh+='<div class="ugroup"><div class="uhead"><b>'+esc(s.name)+'</b><span class="small muted">'+rows.length+' 人還沒簽</span></div><div class="uchips">';
    rows.forEach(function(x){
      var st=x[1], pill = st.blocked===1 ? '<span class="pill draft">等區督導先簽</span>' : st.blocked===2 ? '<span class="pill draft">等門市主管先簽</span>' : st.old ? '<span class="pill todo">改版後未重簽</span>' : st.r ? '<span class="pill doing">閱讀中</span>' : '<span class="pill todo">尚未閱讀</span>';
      uh+='<span class="uchip"><b>'+esc(x[0])+'</b>'+(st.lead?'<span class="pill tag">率先簽收</span>':'')+pill+'</span>';
    });
    uh+='</div></div>';
  });
  h+='<div class="panel" id="p-unsigned"><h2>還沒簽的人（'+un+'）</h2>'+(un ? uh : '<div class="muted">全員都簽完了。</div>')+'</div>';
  /* 簽收順序：很少改，收起來 */
  if(cst){
    var crow=function(layer, label, sid, cur){
      var st1=storeOf(sid), opts='<option value="">不指定（直接開放）</option>';

      return '<tr><td class="small muted">'+layer+'</td><td>'+esc(label)+'</td><td><select id="chain-'+sid+'" data-chg="chain" data-sid="'+sid+'" aria-label="'+esc(label)+'的率先簽收人">'+opts+'</select></td><td>'+stt+'</td></tr>';

    var sumTxt=(!cst.top.name ? "區督導不指定" : cst.top.at ? "區督導已簽" : "區督導還沒簽")+"；門市主管 "+ld+"／"+ln+" 位已簽";
    h+='<div class="panel"><details class="fold" id="chainbox"'+(S.chainOpen?" open":"")+'><summary>簽收順序　<span class="small muted" style="font-weight:400">'+sumTxt+'。主管休假要改指定別人，點這裡打開。</span></summary>';

    var tsS=storeOf(cst.topStore);

    STORES.forEach(function(s){ if(s.id!==cst.topStore && !isFree(s.id)) h+=crow("第二層", s.name, s.id, cst.leads[s.id]||{name:"",at:0}); });
    h+='</tbody></table></div>'+FREE_NOTE()+'</details></div>';
  }
  h+='<div class="panel"><h2>已經簽的人（'+done+'）</h2>';
  if(!done) return h+'<div class="muted">還沒有人簽收。</div></div>';
  h+='<div class="scroll"><table class="rtab"><thead><tr><th>姓名</th><th>簽收時間</th><th>作答次數</th><th>簽名</th></tr></thead><tbody>';
  STORES.forEach(function(s){
    var ok=s.staff.filter(function(nm){ return isDone(a,rec(a.id,pid(s.id,nm))); });

    ok.forEach(function(nm){

      h+='<tr><td>'+esc(nm)+(isL?' <span class="pill tag">率先簽收</span>':'')+'</td><td class="num">'+fmt(r.finishedAt)+'</td><td class="num">'+r.attempts+' 次</td><td>'+sig+'</td></tr>';
    });
  });
  return h+'</tbody></table></div></div>';
}

/* ---------- 公告總覽：每一則做到哪裡、下一步是什麼 ---------- */
function nextStep(raw, a, total){
  if(raw.status==="published"){
    var dn=countDone(a), di=dueInfo(raw);
    if(dn>=total) return {t:"全員簽完", cls:"g"};
    return {t:"還有 "+(total-dn)+" 人沒簽"+(di?"（"+di.text+"）":""), cls:di&&di.late?"e":"w"};
  }
  var ck=check(a.clauses,a.quiz);
  if(ck.e.length) return {t:"有 "+ck.e.length+" 個紅字要修正", cls:"e", btn:"去修正"};
  if(!raw.sig) return {t:"等總經理簽核", cls:"w", btn:"去簽核"};
  return {t:"已簽核，還沒按發布", cls:"w", btn:"去發布"};
}
function vLog(){
  var total=totalStaff();
  var list=mem.anns.slice().sort(function(x,y){ var px=x.status==="published"?1:0, py=y.status==="published"?1:0; return px-py || String(y.date).localeCompare(String(x.date)); });
  var h='<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>公告總覽</h2><div class="row"><button id="btn-todraft" class="btn ghost sm" data-act="tab" data-tab="draft">用 AI 起草一則</button><button id="btn-new" class="btn sm" data-act="newAnn">直接新增公告</button></div></div>';
  h+='<div class="small muted">每一則公告做到哪裡、下一步是什麼，都在這裡。還沒發布的排在前面。</div>';
  if(!list.length) return h+'<div class="muted">還沒有公告。按右上角開始第一則。</div></div>';
  h+='<div class="scroll"><table class="ltab"><thead><tr><th>公告</th><th>狀態</th><th>下一步</th><th>截止日</th><th></th></tr></thead><tbody>';

function fArrow(who){ return '<span class="fa w-'+who+'" aria-hidden="true"><i></i></span>'; }
function fNode(s){
  var h='<div class="fnode w-'+s.who[0]+'"><span class="fnum">'+s.n+'</span><div class="fbody"><div class="fh"><b>'+s.t+'</b>';
  s.who.forEach(function(w){ h+='<span class="fwho w-'+w+'">'+WHO[w]+'</span>'; });
  h+='</div>';
  if(s.s) h+='<p>'+s.s+'</p>';
  if(s.list){ h+='<ol class="fql">'; s.list.forEach(function(x){ h+='<li><b>'+x[0]+'</b><span>'+x[1]+'</span></li>'; }); h+='</ol>'; }
  if(s.q) h+='<div class="fq"><span class="fdia" aria-hidden="true"></span><span>'+s.q+'</span></div>';
  if(s.d) h+='<details class="fd"><summary>怎麼做</summary><p>'+s.d+'</p></details>';
  return h+'</div></div>';
}
function fLink(s, next){
  var w=next.who[0];
  if(s.q) return '<div class="fbr w-'+w+'">'+fArrow(w)+'<div class="fbrc"><div class="fno">'+ELBOW+'<div class="fside"><b>'+s.no[0]+'</b><span>'+s.no[1]+'</span><em>'+s.no[2]+'</em></div></div><span class="flab">'+s.yes+'</span></div></div>';
  return '<div class="fcon w-'+w+'">'+fArrow(w)+(s.to?'<span class="flab">'+s.to+'</span>':'<span></span>')+'</div>';
}
function fMini(who,t){ return '<div class="fmini w-'+who+'"><span>'+t+'</span><small>'+WHO[who]+'</small></div>'; }
function vSop(){

  h+='<div class="fhead"><h2>發一則公告的順序</h2><p class="muted small">從第 1 步照箭頭往下走到第 10 步。每一步的顏色代表由誰做。</p></div><div class="panel flegend"><h2>怎麼看這張圖</h2><ul>'
    +'<li><span class="fsw w-gm"></span><span>金色：<b>總經理</b>做的事</span></li>'
    +'<li><span class="fsw w-hq"></span><span>綠色：<b>營運管理部</b>做的事</span></li>'
    +'<li><span class="fsw w-sv"></span><span>藍色：<b>區督導、門市主管、同仁</b>做的事</span></li>'
    +'<li>'+fArrow("hq")+'<span>往下的箭頭：做完，換下一步。<b>箭頭的顏色就是下一步由誰做</b></span></li>'
    +'<li><span class="felb" aria-hidden="true">'+ELBOW+'</span><span>紅色箭頭：<b>還不能往下走</b>，要退回或另外處理</span></li>'
    +'<li><span class="fdia w-hq" aria-hidden="true"></span><span>虛線框：這一步要<b>先判斷</b>，再決定走哪一邊</span></li>'
    +'</ul></div>';
  h+='<div class="flow">';
  FLOW.forEach(function(s,i){
    var prev=FLOW[i-1], next=FLOW[i+1];
    if(!prev || prev.ph!==s.ph) h+='<section class="fphase"><h3><small>階段'+PHN[s.ph]+'</small>'+PHASES[s.ph]+'</h3>';
    h+=fNode(s);
    var last=!next || next.ph!==s.ph;
    if(next && !last) h+=fLink(s,next);
    if(last) h+='</section>';
    if(next && last) h+=fLink(s,next);
  });
  h+='<div class="fcon w-hq">'+fArrow("hq")+'<span class="fend" style="align-self:end;justify-self:start;margin:0 0 2px">流程結束</span></div>';
  h+='</div>';
  h+='<div class="panel ffork"><h2>發布之後，公告要修改</h2><p class="muted small" style="margin:0">先看改的是什麼，再決定走左邊還是右邊。</p><div class="fk">'
    +'<div class="fkc"><span class="fcond">只改錯字、標點</span>'+fArrow("hq")+fMini("hq","按「更新」")+fArrow("hq")+'<span class="fend">不用重簽</span></div>'
    +'<div class="fkc"><span class="fcond">規則內容有變</span>'+fArrow("hq")+fMini("hq","按「改版」")+fArrow("gm")+fMini("gm","重新簽核")+fArrow("all")+fMini("all","全員重新簽收")+'</div>'
    +'</div></div>';
  return h+'</div>';
}

/* ---------- 起草公告：一份訪談指令。AI 先確認身分、聽老闆直覺講、給摘要，再問十個細節問題 ---------- */
var DRAFT_RULES="你是倚盟電訊營運管理部的公告編輯助理。倚盟電訊是台灣大哥大的特約服務中心，在高雄有五家門市。\n\n公司裡發生了一件事，老闆（總經理）想把它訂成全體同仁要「逐條閱讀、答題、簽名」的公告。你的工作是用聊天的方式訪談他，把事情問清楚，再寫成公告。請照下面五段的順序進行，一段做完才做下一段。\n\n【整段對話的規矩】\n- 用繁體中文，口語、簡短、有禮貌。對方是老闆就稱呼「老闆」；不是老闆，照他說的身分稱呼。\n- 一次只問一題，問完就停下來等回答。不可以一次列出好幾題。\n- 一則訊息只能問一件事，只能有一個問號。下面的題目如果一題裡有兩個問句，拆成兩則訊息：先問第一個，他回答之後再問第二個。\n- 對方會用語音輸入，講得亂、順序顛倒都沒關係。你聽不懂，或一句話有兩種意思時，用一句話反問，例如：「您的意思是 A 還是 B？」\n- 每次他回答後，先用一句話說出你聽到的重點，再問下一題。\n- 他前面已經講過的事，不要再問一次，改成確認：「您剛才提到……，我理解成……，對嗎？」\n- 不可以替老闆決定任何規定。他沒講的就問；他說還沒想好，就記下來，最後列在「請總經理確認」。\n- 公司的稱呼請照用：門市（不說分店）、門市主管、區督導、營運管理部、總經理。公告由營運管理部發布，總經理核定。\n- 對方如果上傳錄音檔而你沒辦法聽，直接說明，請他改用鍵盤上的麥克風做語音輸入。\n\n【第一段：開場】\n1. 你的第一則回覆只說這一句：「請問您是哪一位？您是老闆嗎？」\n2. 他回答是老闆，就說：「老闆辛苦了。應該是有事情發生了，接下來我會請您回答幾個問題。先不用管順序：您現在直覺想公告的是什麼？用語音簡單講給我聽就好，前後順序不用在意，我會幫您整理。」\n   他不是老闆（例如營運管理部同仁代為整理），一樣進行，並記住：最後的公告原文要註明「需送總經理確認」。\n3. 他講完後，給一份摘要：用 3 到 5 行條列你聽到的重點（發生了什麼事、他最在意什麼、他希望大家怎麼做），然後問：「我整理的對嗎？有沒有漏掉的？」\n4. 他確認後說：「接下來我需要更明確的細節，讓整份公告有情境、同仁看得懂。一共十個問題，我一題一題問。」然後問第 1 題。\n\n【第二段：十個問題】\n照順序問。句子可以依他前面講過的內容調整，但意思不能變。有選項的題目，把選項列出來，並說也可以用自己的話回答。\n\n第 1 題　發生了什麼事\n「會有這則公告，一定是有事情發生了。可以告訴我發生了什麼事嗎？用您平常講話的方式說就好，我聽不懂會再問您。」\n（開場時他已經講過，就改成確認你的理解，再問還缺的細節。）\n\n第 2 題　情境與頻率\n「這件事是在什麼情況下發生的？它是每天都有、經常發生，還是偶爾一次？」\n\n第 3 題　造成的傷害\n「這件事讓您不開心，是因為它影響了什麼？例如獎金、客人、帳務，或其他狀況。造成的傷害是什麼？講得出金額最好。」\n\n第 4 題　公告裡要不要寫出是誰\n「這件事是哪一家門市發生的？公告裡您希望怎麼寫？\nA. 寫出門市和人員\nB. 只寫門市，不寫是誰\nC. 都不寫，用『公司發現』帶過」\n他選 A 時，提醒一句：「寫出同仁的姓名，容易在同仁之間引起爭議，我會把這一點列在『請總經理確認』。」然後照他的決定做。\n\n第 5 題　正確的做法\n「以後遇到同樣的情況，您希望同仁正確的做法是什麼？」\n\n第 6 題　呈報的流程（這一題拆成幾個小問題，一樣一次只問一個）\n先說：「接下來要把流程定下來。這是以後長期要照著走的，所以我會問得比較細，問完畫成流程圖給您看。」\n6-1「門市同仁要向誰呈報？」\n6-2「用什麼方式呈報？例如 LINE 群組、表單、當面講。要不要留下文字紀錄？」\n6-3「那位主管收到之後要做什麼？他自己就可以決定，還是要再往上呈報？」\n6-4（要往上時才問）「往上是呈報給哪一位主管？他多久之內要回覆？」\n6-5「主管決定之後，要怎麼回覆同仁？多久之內要回覆？」\n6-6「事情做完之後，還需要回報結案嗎？向誰回報？」\n問完後，把流程排成流程圖給他看，每一步寫清楚「誰、做什麼、在哪裡、多久之內」，格式像這樣：\n① 門市同仁｜在 LINE 群組貼申請｜動手之前\n　↓\n② 門市主管｜在群組回覆核准或不核准｜一個工作天內\n　↓\n③ ……\n然後問：「流程是這樣嗎？要改哪一步？」改到他說對為止。\n\n第 7 題　急件\n7-1「如果負責核准的主管沒辦法及時回覆，同仁可以找誰？」\n7-2「同仁對這個規定有疑問時，要問誰？」\n\n第 8 題　沒有照做的處置\n「如果有人沒有照這個程序做，公司會怎麼處理？第一次和再犯，處理方式一樣嗎？」\n\n第 9 題　公告給誰\n「這則公告要給誰看？\nA. 全公司\nB. 門市同仁\nC. 營運管理部\nD. 特別指定的人（請告訴我是誰）\n可以選不只一個。」\n\n第 10 題　從哪一天開始\n「從哪一天開始？\nA. 公告當天\nB. 下個月 1 號\nC. 另外指定日期（請告訴我日期）」\n\n【第三段：整理給他確認】\n十題問完後，給一份「訪談整理」：\n- 十題的答案，每題一到兩行\n- 流程圖（最後確認的版本）\n- 還沒決定的事\n然後問：「這樣對嗎？對的話我就開始寫公告原文。」他說對，才進第四段。\n\n【第四段：寫公告原文，請他確認】\n1. 用完整的句子寫。不用簡稱、不用術語、不用「依規定辦理」這種空話。每一句都要讓第一天上班的新人看得懂要做什麼。\n2. 內部用語第一次出現時，用一句話說明它的意思。\n3. 順序：為什麼訂這個規定（發生了什麼事、造成什麼傷害）→ 適用誰 → 要怎麼做（照流程圖一步一步寫）→ 不可以做什麼 → 急件怎麼辦 → 沒有照做的處置 → 有疑問找誰 → 哪一天開始。\n4. 事發的門市和人員，照第 4 題的決定寫。\n5. 只寫他講過的內容，不可以自己加規定。語氣是說明規定，不是責備。\n6. 原文前面先建議一個公告標題，不用簡稱和術語。\n7. 原文後面另外列「請總經理確認」：\n   - 還沒決定或你覺得不夠清楚的地方\n   - 出現「扣薪、罰款、賠償、追回、分攤」這類字眼的句子。照他的原意寫，並提醒「執行前建議先請勞資顧問或律師看過」\n   - 公告裡寫出同仁姓名的地方\n   沒有就寫「無」。\n8. 最後問：「這份原文可以定稿嗎？要改哪裡？」然後停下來。他說可以定稿，才進第五段。\n\n【第五段：轉成公告簽收系統要用的三段文字】\n\n條文區的寫法：\n- 一條只講一件事。整則公告拆成 4 到 11 條。\n- 每條第一行：條：標籤｜標題\n  標籤 2 到 4 個字，例如 目的、觀念、規範一、規範二、步驟、說明、提醒。標題 14 個字以內。\n- 接著每行寫一個重點。每條 2 到 4 個重點，每個重點 30 個字以內。\n- 每個重點的行首放一個符號，再空一格：\n  ✓ 要做的事\n  ✕ 不可以做的事\n  ⚠ 違反的後果或風險\n  • 背景或說明\n- 每個重點用【】框出最重要的 2 到 10 個字，一行只框一處。字數太緊時把句子寫短，【】不能省。\n- 需要時可以多加這三種行：\n  註：補充說明，系統會用小字顯示\n  例：要同仁照著填的格式或範例，一行寫一個「例：」\n  途徑：第一步 → 第二步 → 第三步（把流程圖排成一條路線，放在最後一條。這一條只要一個 • 重點、一行途徑、一行原文，不用出題）\n- 每條最後一行：原文：把這一條對應的原文句子照抄；對應到好幾句時，照抄最主要的一兩句。\n- 條與條之間空一行。\n\n題目區的寫法：\n- 一共 10 題。每一條至少要有 1 題（只有「途徑：」的那一條除外）。\n- 用門市實際會遇到的情境出題，不要考背誦。\n- 每題五行，每行開頭的字不能改：\n  題：題目\n  對：正確答案\n  錯：錯誤答案\n  錯：錯誤答案\n  條：數字\n  「條：」只寫數字，代表答案在條文區由上往下數的第幾條，不是標籤裡的數字。\n- 每題剛好 1 個「對」、2 個「錯」。\n- 錯誤答案要像同仁真的會有的想法，但依公告內容明確是錯的。不可以有兩個選項都說得通。\n- 三個選項的長度盡量接近，不要讓正確答案總是最長。\n- 題與題之間空一行。\n\n格式範例。條文區的一條長這樣：\n條：規範二｜事先回報\n• 客戶要求取消，或遇到特殊狀況\n✓ 作業前【先通報門市主管】\n✕ 不可以【先做再報】\n原文：遇客戶要求或特殊狀況需要取消，作業前務必先通報門市主管。\n\n題目區的一題長這樣：\n題：客人回到門市，要求取消昨天辦好的申辦。你的第一步是？\n對：先通報門市主管\n錯：先幫客人取消，下班前再跟主管說\n錯：請同事幫忙操作取消\n條：4\n\n訪談紀錄的寫法（給公司存檔，之後查得到當初為什麼訂這條規定）：\n訪談對象：\n想公告的事（一句話）：\n1 發生了什麼事：\n2 情境與頻率：\n3 造成的傷害：\n4 公告裡怎麼寫是誰：\n5 正確的做法：\n6 流程：第一步 → 第二步 → 第三步\n7 急件找誰：\n8 沒有照做的處置：\n9 公告對象：\n10 開始日期：\n請總經理確認的事：\n\n第五段的輸出，依序給三樣東西，不要加其他說明：\n1. 條文區：放在一個程式碼區塊裡\n2. 題目區：放在另一個程式碼區塊裡\n3. 訪談紀錄：放在第三個程式碼區塊裡\n最後加一句：「請把條文區和題目區貼到公告簽收系統的『編輯公告』， function fChart(L, PH){
  var h='<div class="flow">';
  L.forEach(function(s,i){
    var prev=L[i-1], next=L[i+1];
    if(!prev || prev.ph!==s.ph) h+='<section class="fphase"><h3><small>階段'+PHN[s.ph]+'</small>'+PH[s.ph]+'</h3>';
    h+=fNode(s);
    var last=!next || next.ph!==s.ph;
    if(next && !last) h+=fLink(s,next);
    if(last) h+='</section>';
    if(next && last) h+=fLink(s,next);
  });
  return h+'</div>';
}

  function pos(e){ var b=cv.getBoundingClientRect(), kx=b.width?(cv.width/dpr)/b.width:1, ky=b.height?(cv.height/dpr)/b.height:1; return {x:(e.clientX-b.left)*kx, y:(e.clientY-b.top)*ky}; }
  /* 平板上簽名時，不讓瀏覽器跳出「複製／貼上／選取」的選單，也不讓它把筆劃當成選字或捲動 */
  var box=cv.parentNode;
  ["contextmenu","selectstart","dragstart"].forEach(function(t){ box.addEventListener(t,function(e){ e.preventDefault(); }); });
  ["touchstart","touchmove","touchend"].forEach(function(t){ cv.addEventListener(t,function(e){ if(e.cancelable) e.preventDefault(); },{passive:false}); });
  /* 一次只認一支筆或一根手指；用過觸控筆之後，手掌碰到螢幕不算 */
  cv.addEventListener("pointerdown",function(e){ e.preventDefault();
    try{ var sel=window.getSelection(); if(sel && sel.removeAllRanges) sel.removeAllRanges(); }catch(_){ }
    var ae=document.activeElement; if(ae && ae!==document.body && ae.blur && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur();
    if(e.pointerType==="pen") pen=true;
    if(down || (pen && e.pointerType==="touch")) return;
    down=true; pid0=e.pointerId; var p=pos(e); lx=p.x; ly=p.y; try{cv.setPointerCapture(e.pointerId);}catch(_){ } });
  cv.addEventListener("pointermove",function(e){
    if(!down || e.pointerId!==pid0) return; var p=pos(e);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
    len+=Math.abs(p.x-lx)+Math.abs(p.y-ly); lx=p.x; ly=p.y;
    if(len>120 && !fired){ fired=true; onInk(); }
  });
  function up(e){ if(e.pointerId===pid0){ down=false; pid0=null; } }
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
}

  else if(v==="fail") html=vFail(); else if(v==="sign") html=vSign(); else if(v==="done") html=vDone(); else if(v==="review") html=vReview(); else html=vAdmin();
  view.innerHTML=html;

function begin(annId){
  var a=ann(annId), p=pid(mem.me.store,mem.me.name), r=rec(annId,p), same = r && r.version===a.version && r.status!=="done";
  var g0=gateFor(a,mem.me); if(g0 && g0.blocked){ render(); return; }
  S.A=a; S.ci=0; S.seen=-1; S.attempts = same && r.attempts ? r.attempts : 1;
  S.startedAt = same && r.startedAt ? r.startedAt : Date.now();
  setRec(annId,p,{status:"reading", version:a.version, startedAt:S.startedAt, attempts:S.attempts});
  sendEvent("start");
  S.view="read"; render();
}
